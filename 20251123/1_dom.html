 <!--網頁內容多個元素組成-->

    <script>
    //這裡開始是JS，可發現註解長不太一樣
    //透過ID取的特定元素(傳統)
    const elTitle=document.getElementById("myTitle");
    console.log(elTitle);
    //透過CSS 選擇器 取得單一元素(比較常用)
    document.querySelector("#red");
    document.querySelector(".text.red");

    //透過CSS 選擇器 取得多個元素 NodeList(比較常用)

//-----------
