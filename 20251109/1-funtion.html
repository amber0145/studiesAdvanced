//---必包計數器

function createCounter() {
  let count = 0; // creatCounter的區間變數，對inc,getCount來說是外部變數
  
  function increment() {
    count++;
    console.log(`計數：${count}`);
  }
  
  function getCount() {
    return count;
  }
  
  return {
    increment,getCount
  };
}

const counter = createCounter();
counter.increment(); // 計數：1
counter.increment(); // 計數：2
console.log(counter.getCount()); // 2
